plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.20.1'
    id 'com.github.spotbugs' version '6.5.6'
}

apply plugin: 'idea'

group 'fish.payara.micro.tools'
version '2.4.0-SNAPSHOT'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

repositories {
    mavenLocal()
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
    maven {
        url "https://nexus.dev.payara.fish/repository/payara-artifacts/"
    }
}

dependencies {
    intellijPlatform {
        intellijIdea(providers.gradleProperty('platformVersion'))
        bundledPlugins('com.intellij.java', 'org.jetbrains.idea.maven',
                'org.jetbrains.plugins.gradle', 'org.jetbrains.plugins.terminal')
        bundledModules('intellij.platform.debugger', 'intellij.platform.externalSystem',
                'intellij.terminal.frontend')
        testFramework org.jetbrains.intellij.platform.gradle.TestFrameworkType.JUnit5.INSTANCE
        testFramework org.jetbrains.intellij.platform.gradle.TestFrameworkType.Platform.INSTANCE
    }
    implementation 'fish.payara.tools:payara-qube:2.0.0'
    implementation 'fish.payara.qube:qube-api:2.0.0'
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

spotbugs {
    effort = com.github.spotbugs.snom.Effort.valueOf('MAX')
    reportLevel = com.github.spotbugs.snom.Confidence.valueOf('LOW')
    ignoreFailures = true
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask) {
    reports {
        xml.required = true
        html.required = false
    }
}

test {
    useJUnitPlatform()
}

intellijPlatform {
    pluginConfiguration {
        name = 'Payara Community Tools'
        ideaVersion {
            sinceBuild = '263.7307.200'
            untilBuild = '263.*'
        }
    }
    publishing {
        token = providers.systemProperty('fish.payara.micro.intellij.publish.token')
    }
    pluginVerification {
        // Marketplace plugin 15445 already uses this ID; changing it would break updates.
        freeArgs = ['-mute', 'TemplateWordInPluginId']
        ides {
            current()
        }
    }
}
